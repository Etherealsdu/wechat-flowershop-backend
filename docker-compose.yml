version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: wechat-admin-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-wechat_flowershop}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --innodb-log-file-size=64M

  redis:
    image: redis:7-alpine
    container_name: wechat-admin-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  app:
    build: .
    container_name: wechat-admin-app
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-3306}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - NODE_ENV=production
    volumes:
      - uploads_data:/app/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: wechat-admin-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - uploads_data:/var/www/uploads
    environment:
      - NGINX_PORT=${NGINX_PORT:-80}

volumes:
  db_data:
  redis_data:
  uploads_data: